# xdg-desktop-portal-hyprland の設定
# https://wiki.hypr.land/Hypr-Ecosystem/xdg-desktop-portal-hyprland/
screencopy {
    # AMD GPU が出力する DCC 圧縮 modifier (GFX12, DCC) 付きの DMA-BUF を Chrome/Meet が
    # 受け取ると真っ黒になるため、共有フレームを SHM (CPU メモリ) で渡して圧縮バッファを回避する。
    # これによりウィンドウ/スクリーン共有が黒くなる問題を防ぐ。タブ共有は元々 DMA-BUF を使わない
    force_shm = true

    # Chromium 系はプレビュー用と本番用でポータルセッションを 2 回作るため、そのままだとピッカーが 2 回出る。
    # restore token を既定で許可すると 2 回目は 1 回目の選択が復元されて選択は 1 回で済む。
    # 副作用としてブラウザを再起動するまで前回の選択が復元され続けるので、変えたいときは
    # Chrome の共有ダイアログの「再選択」を使う。https://issues.chromium.org/issues/354537406
    allow_token_by_default = true
}
