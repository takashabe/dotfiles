# xdg-desktop-portal-hyprland の設定
# https://wiki.hypr.land/Hypr-Ecosystem/xdg-desktop-portal-hyprland/
screencopy {
    # AMD GPU が出力する DCC 圧縮 modifier (GFX12, DCC) 付きの DMA-BUF を Chrome/Meet が
    # 受け取ると真っ黒になるため、共有フレームを SHM (CPU メモリ) で渡して圧縮バッファを回避する。
    # これによりウィンドウ/スクリーン共有が黒くなる問題を防ぐ。タブ共有は元々 DMA-BUF を使わない
    force_shm = true

    # Chromium 系は 1 回の共有でプレビュー用と本番用の 2 セッションを作り、restore token を
    # 両者で共有しないためピッカーが 2 回出る。直近の選択を使い回すラッパーで 1 回に抑える。
    # token 方式 (allow_token_by_default) とは併用しない (前回選択が残り続ける副作用が出るため)
    custom_picker_binary = /home/takashabe/.config/hypr/scripts/share-picker-cached.sh
}
